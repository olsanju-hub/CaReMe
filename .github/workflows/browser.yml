name: Auditoría de navegador
on:
  push:
    branches: [feat/prototipo-interfaz]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Navegación, móvil, privacidad y offline
        run: npm run test:browser
      - name: Informe y capturas sintéticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-${{ github.run_id }}
          path: qa-results/
          retention-days: 7
